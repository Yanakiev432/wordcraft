[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
craft-signing-core = { version = "=0.1.0", git = "https://github.com/Yanakiev432/craft-signing-core.git", rev = "53fbf3557682ef6e206ff8304495baf80bcb897a" }
