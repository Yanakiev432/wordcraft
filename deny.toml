# Fail-closed security scan. Do not suppress RustSec vulnerabilities to achieve a green CI.
# This scan is separate from the human-reviewed software licence policy.
[advisories]
yanked = "warn"
# Transitive, unmaintained crates in the Linux accessibility and legacy font
# stack have no safe upstream replacement today. Track those separately.
# Directly used unmaintained crates still fail the build.
unmaintained = "workspace"
# Actual security vulnerabilities remain hard errors: no RustSec waivers.
ignore = []
