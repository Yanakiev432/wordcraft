name: One-shot zip 9 RustSec remediation
on:
  push:
    branches: [security/fix-rustsec-2026-0382-20261021]
    paths: ['.github/workflows/zip9-one-shot-lock-update.yml']
permissions:
  contents: write
jobs:
  lockfile-only-zip9:
    if: (github.repository == 'Yanakiev432/wordcraft' || github.repository == 'Yanakiev432/gridcraft') && github.ref == 'refs/heads/security/fix-rustsec-2026-0382-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 1}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with: {toolchain: stable}
      - name: Refresh lockfile with patched zip 9 stable
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p zip --precise 9.0.0
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock=tomllib.loads(Path('Cargo.lock').read_text())
          z=[p['version'] for p in lock['package'] if p['name']=='zip']
          assert z==['9.0.0'], z
          print('ZIP_9_0_0_LOCKED_NO_KNOWN_EXTRACTION_ADVISORIES=PASS')
          PY
          git diff --check
          changes=$(git diff --name-only)
          test "$changes" = 'Cargo.lock' || { printf '%s\n' "UNEXPECTED CHANGES: $changes"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(security): lock zip 9.0.0 to prevent symlink and Unix permission extraction attacks'
          git push origin HEAD:security/fix-rustsec-2026-0382-20261021
