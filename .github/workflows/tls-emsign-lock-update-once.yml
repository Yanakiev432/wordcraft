name: One-shot emSign TLS chain security lockfile patch
on:
  push:
    branches: [feature/tls-emsign-trust-chain-fix-20261021]
    paths: ['.github/workflows/tls-emsign-lock-update-once.yml']
permissions:
  contents: write
jobs:
  patch-one-lockfile:
    if: github.repository == 'Yanakiev432/wordcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Remediate RUSTSEC-2026-0382, never ignore the advisory
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls-webpki --precise 0.103.16
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          d=tomllib.loads(Path("Cargo.lock").read_text())
          got={p["version"] for p in d["package"] if p["name"]=="rustls-webpki"}
          if got!={"0.103.16"}:raise SystemExit(f"Unsafe rustls-webpki dependency: {got}")
          print("RUSTSEC_2026_0382_FIXED=PASS")
          PY
          git diff --check
          changed=$(git diff --name-only)
          if [ "$changed" != "Cargo.lock" ]; then
            echo "REFUSE_NON_LOCKFILE_UPDATE=$changed";exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(security): update rustls-webpki for compromised emSign intermediates'
          git push origin HEAD:feature/tls-emsign-trust-chain-fix-20261021
