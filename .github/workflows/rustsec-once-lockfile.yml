name: One-shot RustSec webpki lockfile remediation
on:
  push:
    branches: [security/fix-rustsec-2026-0382-20261021]
    paths: ['.github/workflows/rustsec-once-lockfile.yml']
permissions:
  contents: write
jobs:
  patch-lockfile-only:
    if: (github.repository == 'Yanakiev432/wordcraft' || github.repository == 'Yanakiev432/gridcraft') && github.ref == 'refs/heads/security/fix-rustsec-2026-0382-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 1}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with: {toolchain: stable}
      - name: Upgrade only rustls-webpki against confirmed advisory
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls-webpki --precise 0.103.16
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          d=tomllib.loads(Path('Cargo.lock').read_text())
          affected=[p['version'] for p in d['package'] if p['name']=='rustls-webpki']
          assert affected==['0.103.16'], affected
          print('RUSTSEC-2026-0382_REMEDIATED=PASS')
          PY
          git diff --check
          changes=$(git diff --name-only)
          test "$changes" = "Cargo.lock" || { echo "LOCKFILE_ONLY_CHECK_FAILED $changes"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(security): upgrade rustls-webpki to 0.103.16 against distrusted intermediary'
          git push origin HEAD:security/fix-rustsec-2026-0382-20261021
