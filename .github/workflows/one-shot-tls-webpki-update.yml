name: One-shot Word and Grid TLS advisory patch
on:
  push:
    branches:
      - feature/tls-webpki-security-20261021
    paths:
      - '.github/workflows/one-shot-tls-webpki-update.yml'
permissions:
  contents: write
jobs:
  exact-locked-security-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Apply patched semver-compatible rustls-webpki exactly
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls-webpki --precise 0.103.16
          python3 - <<'PY'
          import tomllib
          with open('Cargo.lock','rb') as f:lock=tomllib.load(f)
          packages=[x for x in lock['package'] if x['name']=='rustls-webpki']
          assert len(packages)==1, 'Unexpected duplicate rustls-webpki packages'
          assert packages[0]['version']=='0.103.16', packages[0]['version']
          print('RUSTSEC_2026_0382_VERSION_PATCH=PASS')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "Cargo.lock" ]; then
            echo "Unexpected lockfile security scope: $changed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(deps): patch rustls-webpki distrusted intermediate RUSTSEC-2026-0382'
          git push origin HEAD:feature/tls-webpki-security-20261021
          echo 'ONE_SHOT_SECURITY_UPDATE_COMPLETE=PASS'
