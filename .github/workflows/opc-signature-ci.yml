name: OPC wordcraft signing acceptance
on:
  push:
    branches:
      - feature/opc-xml-dsig-cli-20261019
      - feature/native-signing-ui-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-opc:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout application fork at exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout reviewed common signer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Yanakiev432/craft-signing-core
          ref: b7eb72a63b83247590a24b571288a0b7b970642c
          path: opc-core
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Cache reproducible Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: opc-signature-ci-windows
      - name: Rust format and build application CLI
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Cargo fmt failed" }
          cargo build --locked -p wordcraft-cli
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }
      - name: Build desktop application with signing ribbon
        shell: pwsh
        run: |
          cargo build --locked --release -p wordcraft
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Upload Windows desktop application
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-windows-signing-ribbon
          path: target/release/wordcraft.exe
          if-no-files-found: error
      - name: Sign verify and tamper-check synthetic DOCX and XLSX (in-memory test identity)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'target/opc-acceptance'
          & ./opc-core/tools/test_opc_signature_windows.ps1 -ArtifactDirectory $dir
          # The helper deliberately runs negative native-command tests: their
          # expected exit code 1 remains in LASTEXITCODE even after script PASS.
          # PowerShell script invocation status is the correct acceptance gate.
          if (-not $?) { throw "Core OPC fixture sign/verify failed" }
          # Two independent signers and explicit Craft-only restrictive policy
          # are mandatory additions to the shared signer test.
          foreach ($family in @('docx','xlsx')) {
            $two = Join-Path $dir ('two-signers.' + $family)
            if (-not (Test-Path -LiteralPath $two)) {
              throw ('Missing two-signer ' + $family + ' fixture')
            }
          }
          # GitHub wraps a pwsh step with exit $LASTEXITCODE; negative checks
          # intentionally return 1, so explicitly clear only this stale value.
          $global:LASTEXITCODE = 0
      - name: Verify package through actual wordcraft CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'target/opc-acceptance'
          $cli = Join-Path $PWD 'target/debug/wordcraft-cli.exe'
          & $cli opc-verify (Join-Path $dir 'signed.docx')
          if ($LASTEXITCODE -ne 0) { throw "wordcraft CLI rejected valid OPC signature" }
          & $cli opc-verify (Join-Path $dir 'tampered.docx')
          if ($LASTEXITCODE -eq 0) { throw "wordcraft CLI falsely accepted tampered file" }
          # GitHub wraps pwsh steps with exit $LASTEXITCODE. The tampered
          # document MUST return 1; normalize only after asserting rejection.
          $global:LASTEXITCODE = 0
      - name: Real CLI signing path with a disposable Windows software key (not QES)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'target/opc-acceptance'
          $cli = Join-Path $PWD 'target/debug/wordcraft-cli.exe'
          $cert = $null
          $cert2 = $null
          try {
            $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Craft CI test only not QES' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -NotAfter (Get-Date).AddHours(1)
            & $cli opc-sign (Join-Path $dir 'original.docx') (Join-Path $dir 'cli-signed.docx') --thumbprint $cert.Thumbprint
            if ($LASTEXITCODE -ne 0) { throw "wordcraft CLI signing failed" }
            & $cli opc-verify (Join-Path $dir 'cli-signed.docx')
            if ($LASTEXITCODE -ne 0) { throw "wordcraft CLI-signed package cannot verify" }

            $cert2 = New-SelfSignedCertificate -Type Custom -Subject 'CN=Craft CI second independent signer not QES' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -KeyUsage DigitalSignature -NotAfter (Get-Date).AddHours(1)
            & $cli opc-sign (Join-Path $dir 'cli-signed.docx') (Join-Path $dir 'cli-two-signers.docx') --thumbprint $cert2.Thumbprint --allow-additional-signatures
            if ($LASTEXITCODE -ne 0) { throw 'wordcraft CLI second independent signer failed' }
            $result = (& $cli opc-verify (Join-Path $dir 'cli-two-signers.docx') | Out-String) | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $result.signature_count -ne 2 -or -not $result.integrity_pass) {
              throw 'wordcraft CLI second signature did not preserve prior signature'
            }
            Write-Host 'CLI_TWO_INDEPENDENT_SIGNERS=PASS'

          } finally {
            if ($cert) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\"+$cert.Thumbprint) -Force -ErrorAction SilentlyContinue }
            if ($cert2) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\"+$cert2.Thumbprint) -Force -ErrorAction SilentlyContinue }
          }
